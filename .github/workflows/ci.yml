# Free for public repositories (GitHub Actions minutes are unlimited there).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt ruff
      - name: Lint
        run: ruff check src scripts tests --select E9,F63,F7,F82
      - name: Tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t jobtracker-api .
      - name: Start container and check /health
        run: |
          docker run -d --name api -p 8000:8000 jobtracker-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/health | grep -q models_not_loaded
